name: Temporary Playback Feature Check

on:
  push:
    branches:
      - codex/playback-speed-repeat-selection-20260831

permissions:
  contents: write

jobs:
  patch_build_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/playback-speed-repeat-selection-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply feature patch
        run: python scripts/temp_apply_playback_feature.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit checked changes
        run: |
          rm scripts/temp_apply_playback_feature.py
          rm .github/workflows/temp-apply-playback-feature.yml
          git config user.name "Josi Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/loopEditor.css src/enhancements.css architecture.md concept.md scripts/temp_apply_playback_feature.py .github/workflows/temp-apply-playback-feature.yml
          git commit -m "Add playback speed and selected repeat mode"
          git push origin HEAD:codex/playback-speed-repeat-selection-20260831
