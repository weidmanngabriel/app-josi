name: Temporary Sidebar Colors Layout
on:
  push:
    branches:
      - codex/sidebar-selection-colors-layout-20260901
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sidebar-selection-colors-layout-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply product changes
        run: |
          python .github/scripts/apply-sidebar-colors-layout.py
          python .github/scripts/fix-sidebar-colors-layout.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit checked product changes
        run: |
          git config user.name "Gabriel Weidmann"
          git config user.email "gabriel@weidmann.net"
          git add src/App.tsx src/ColorSpectrumPicker.tsx src/styles.css src/enhancements.css architecture.md concept.md
          git commit -m "Add sidebar bulk tools colors and layout editing"
          git push origin HEAD:codex/sidebar-selection-colors-layout-20260901
