name: Temporary Repeat Click Adjustment

on:
  push:
    branches:
      - codex/playback-speed-repeat-selection-20260831

permissions:
  contents: write

jobs:
  adjust_build_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/playback-speed-repeat-selection-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply adjustment
        run: python scripts/temp_repeat_click_adjust.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit checked adjustment
        run: |
          rm scripts/temp_repeat_click_adjust.py
          rm .github/workflows/temp-repeat-click-adjust.yml
          git config user.name "Josi Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx architecture.md concept.md scripts/temp_repeat_click_adjust.py .github/workflows/temp-repeat-click-adjust.yml
          git commit -m "Refine selected repeat toggle"
          git push origin HEAD:codex/playback-speed-repeat-selection-20260831
