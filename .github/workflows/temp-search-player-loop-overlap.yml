name: Temporary Search Player Loop

on:
  push:
    branches: [codex/search-player-loop-overlap-20260831]

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/search-player-loop-overlap-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply product changes
        run: python .github/scripts/apply-search-player-loop-overlap.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit checked product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/musicDb.ts src/enhancements.css architecture.md concept.md
          git commit -m "Add search expanded transport and overlapping loops"
          git push origin HEAD:codex/search-player-loop-overlap-20260831
