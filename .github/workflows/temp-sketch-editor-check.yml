name: Temporary Sketch Editor Check

on:
  push:
    branches: [codex/sketch-loop-editor-20260831]

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/sketch-loop-editor-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply sketch editor migration
        run: python .github/scripts/apply-sketch-editor.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit checked product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/enhancements.css src/loopEditor.css architecture.md concept.md
          git commit -m "Rebuild loop editor from interface sketch"
          git push origin HEAD:codex/sketch-loop-editor-20260831
