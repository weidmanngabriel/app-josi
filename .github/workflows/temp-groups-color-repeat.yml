name: Temporary Groups Color Repeat

on:
  push:
    branches:
      - codex/groups-color-repeat-20260831

permissions:
  contents: write

jobs:
  verify-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/groups-color-repeat-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean documentation
        run: python .github/scripts/cleanup-groups-docs.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit checked documentation
        run: |
          git config user.name "Josi Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add architecture.md concept.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "Update grouping documentation"
            git push origin codex/groups-color-repeat-20260831
          fi
