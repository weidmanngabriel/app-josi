name: Final Player Selection Check

on:
  push:
    branches: [codex/player-selection-loop-settings-20260831]

permissions:
  contents: write

jobs:
  fix-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/player-selection-loop-settings-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix selection confirmations
        run: python .github/scripts/fix-selection-confirmations.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit final checked fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Fix selection confirmation dialogs"
          git push origin HEAD:codex/player-selection-loop-settings-20260831
