name: Final Temporary Loop Refinement Check

on:
  push:
    branches: [codex/compact-loop-editor-controls-20260831]

permissions:
  contents: write

jobs:
  fix-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/compact-loop-editor-controls-20260831
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final refinement fix
        run: python .github/scripts/fix-loop-refinement.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Commit checked final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/loopEditor.css
          git commit -m "Fix loop editor select defaults and dialog layering"
          git push origin HEAD:codex/compact-loop-editor-controls-20260831
