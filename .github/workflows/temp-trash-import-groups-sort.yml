name: Temporary Trash Import Groups

on:
  push:
    branches:
      - codex/trash-import-groups-sort-20260831

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/trash-import-groups-sort-20260831
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harden product changes
        run: python .github/scripts/harden-trash-import-groups-sort.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit checked product changes
        run: |
          git config user.name "Gabriel Weidmann"
          git config user.email "gabriel@weidmann.net"
          git add src/App.tsx src/musicDb.ts src/enhancements.css architecture.md concept.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden trash restore and sort controls"
          git push origin HEAD:codex/trash-import-groups-sort-20260831
