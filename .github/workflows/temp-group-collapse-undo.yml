name: Temporary Group Collapse Undo

on:
  push:
    branches:
      - codex/group-collapse-undo-20260901

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/group-collapse-undo-20260901
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply product changes
        run: python .github/scripts/apply-group-collapse-undo.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit checked product changes
        run: |
          git config user.name "Josi Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/enhancements.css architecture.md concept.md
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Make object groups collapsible and undoable"
            git push origin codex/group-collapse-undo-20260901
          fi
