name: Temporary Tags Clipboard

on:
  push:
    branches:
      - codex/tags-clipboard-collapse-20260831

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/tags-clipboard-collapse-20260831
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply product changes
        run: python .github/scripts/apply-tags-clipboard-collapse.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit checked product changes
        run: |
          git config user.name "Gabriel Weidmann"
          git config user.email "gabriel@weidmann.net"
          git add src/App.tsx src/musicDb.ts src/enhancements.css architecture.md concept.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add tags clipboard and collapsible navigation"
          git push origin HEAD:codex/tags-clipboard-collapse-20260831
